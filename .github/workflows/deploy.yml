name: Deploy Salmon Map to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: salmon-map
        run: |
          if [ -f package-lock.json ]; then
            echo "🔒 package-lock.json found — running npm ci"
            npm ci
          else
            echo "⚙️ No lock file found — running npm install"
            npm install
          fi

      - name: Build React project
        working-directory: salmon-map
        run: npm run build

      - name: Upload built files for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          # 👇 this tells GitHub to deploy the salmon-map build output
          path: salmon-map/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
